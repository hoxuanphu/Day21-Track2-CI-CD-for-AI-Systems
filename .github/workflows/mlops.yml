name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần S3)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên S3
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = us-east-1" >> ~/.aws/config

      - name: Pull data with DVC
        run: dvc pull

      - name: Setup MLflow
        run: |
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          export MLFLOW_ARTIFACT_ROOT=./mlartifacts
          python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///mlflow.db'); mlflow.create_experiment('0') if '0' not in [e.experiment_id for e in mlflow.search_experiments()] else None"

      - name: Train model
        run: |
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          export MLFLOW_ARTIFACT_ROOT=./mlartifacts
          python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACCURACY=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACCURACY"

      - name: Upload model to S3
        run: |
          python - <<'EOF'
          import boto3
          import os
          
          s3 = boto3.client('s3')
          bucket = "${{ secrets.S3_BUCKET }}"
          
          # Upload model
          s3.upload_file(
              'models/model.pkl',
              bucket,
              'models/latest/model.pkl'
          )
          print(f"Model uploaded to s3://{bucket}/models/latest/model.pkl")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép deploy khi accuracy >= 0.70
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import sys
          
          accuracy = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.70
          
          print(f"Accuracy: {accuracy:.4f}")
          print(f"Threshold: {threshold:.4f}")
          
          if accuracy < threshold:
              print(f"❌ FAILED: Accuracy {accuracy:.4f} < {threshold:.4f}")
              sys.exit(1)
          else:
              print(f"✅ PASSED: Accuracy {accuracy:.4f} >= {threshold:.4f}")
          EOF

  # JOB 4: Triển khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Restart service
            sudo systemctl restart mlops-serve
            
            # Wait for service to start
            sleep 5
            
            # Health check
            if curl -f http://localhost:8000/health; then
              echo "✅ Service is healthy"
            else
              echo "❌ Health check failed"
              exit 1
            fi
